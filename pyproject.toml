[project]
name = "candidatelab"
version = "0.1.0"
description = "A CLI/TUI for generating bounded password or username/password candidates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rich>=14,<15"]

[project.optional-dependencies]
ui = ["textual>=0.60"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
candidatelab = "candidatelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
